<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>কালার রিকুয়েস্ট</title>
<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --p1:#0f6e5c;
    --p2:#12a37f;
    --p3:#5fd6ae;
    --accent:#ffb703;
    --accent2:#fb8500;
    --bg:#f2f7f5;
    --card:#ffffff;
    --text:#1c2a27;
    --muted:#6c7b78;
    --danger:#e5484d;
    --border:#d6e0dc;
    --grid-line:#c3d1cc;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', 'Noto Sans Bengali', sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(95,214,174,0.18), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(255,183,3,0.15), transparent 35%),
      var(--bg);
    color:var(--text);
    padding-bottom:44px;
  }
  header{
    background:linear-gradient(120deg,var(--p1),var(--p2) 55%,var(--p3));
    color:#fff;
    padding:22px 16px 20px;
    text-align:center;
    border-radius:0 0 24px 24px;
    box-shadow:0 6px 18px rgba(15,110,92,0.28);
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    top:-40px; right:-30px;
    width:120px; height:120px;
    background:rgba(255,255,255,0.12);
    border-radius:50%;
  }
  header h1{margin:0;font-size:21px;font-weight:800;letter-spacing:0.3px;}
  header p{margin:5px 0 0;font-size:12.5px;opacity:0.92;}

  .container{
    max-width:480px;
    margin:16px auto 0;
    padding:0 12px;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    padding:16px;
    box-shadow:0 3px 12px rgba(15,50,40,0.08);
    margin-bottom:16px;
    border-top:5px solid var(--p2);
  }

  .header-field{margin-bottom:10px;}
  .header-field label{
    display:block;
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:5px;
    font-weight:700;
  }
  .header-field input{
    width:100%;
    padding:14px 12px;
    border:2px solid var(--p2);
    border-radius:12px;
    font-size:20px;
    font-weight:800;
    color:var(--p1);
    background:#fbfcfc;
    text-align:center;
  }
  .header-field input::placeholder{color:#a9b8b4;font-weight:600;}
  .header-field input:focus{outline:none;box-shadow:0 0 0 3px rgba(18,163,127,0.18);}

  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:5px;
    font-weight:600;
  }
  .field input{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:9px;
    font-size:14px;
    background:#fbfcfc;
  }
  .field input:focus{outline:none;border-color:var(--p2);}

  .row-two{display:flex;gap:10px;margin-top:10px;}
  .row-two .field.grow{flex:2;}
  .row-two .field.small{flex:1;}

  .section-title{
    font-size:12.5px;
    font-weight:800;
    color:var(--p1);
    margin:16px 0 8px;
    padding-left:9px;
    border-left:4px solid var(--accent);
    display:flex;
    align-items:center;
    gap:6px;
  }

  /* Spreadsheet / Excel-like grid */
  .sheet-wrap{
    overflow-x:auto;
    border:1px solid var(--grid-line);
    border-radius:8px;
  }
  table.sheet{
    width:100%;
    border-collapse:collapse;
    background:#fff;
  }
  table.sheet th{
    background:linear-gradient(120deg,#e8f6f1,#f5fbf8);
    color:var(--p1);
    font-size:11px;
    font-weight:800;
    padding:7px 4px;
    text-align:center;
    border:1px solid var(--grid-line);
  }
  table.sheet td{
    border:1px solid var(--grid-line);
    padding:0;
    text-align:center;
  }
  table.sheet td.sl{
    background:#f6f8f7;
    color:var(--muted);
    font-size:12px;
    width:22px;
    padding:6px 2px;
  }
  table.sheet td.swatch-cell{width:34px;padding:6px;}
  table.sheet td.swatch-cell input[type=color]{
    width:26px;height:26px;
    border:none;
    padding:0;
    border-radius:6px;
    background:none;
  }
  table.sheet td input, table.sheet td select{
    width:100%;
    border:none;
    background:transparent;
    padding:8px 5px;
    font-size:13px;
    text-align:center;
    font-family:inherit;
  }
  table.sheet td.col-name input{text-align:left;}
  table.sheet td input:focus, table.sheet td select:focus{outline:none;background:#eaf7f2;}
  table.sheet tbody tr:nth-child(even) td:not(.sl):not(.swatch-cell){background:#fbfdfc;}

  .del-cell{width:24px;background:#fff;}
  .del-btn{
    background:none;
    border:none;
    color:var(--danger);
    font-size:15px;
    cursor:pointer;
    padding:4px;
  }

  .add-row-btn{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:1.5px dashed var(--p2);
    background:#f2fbf8;
    color:var(--p1);
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }

  .totals{
    margin-top:14px;
    padding-top:12px;
    border-top:1px dashed var(--border);
    font-size:13px;
    font-weight:700;
  }
  .totals-line{display:flex;justify-content:space-between;padding:3px 0;}
  .totals-line span.value{color:var(--p1);}

  .pdf-btn{
    width:100%;
    padding:15px;
    margin-top:14px;
    background:linear-gradient(120deg,var(--accent),var(--accent2));
    color:#4a2a00;
    border:none;
    border-radius:14px;
    font-size:15.5px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(251,133,0,0.4);
  }
  .pdf-btn:active{transform:scale(0.98);}

  .empty-note{
    font-size:12.5px;
    color:var(--muted);
    text-align:center;
    padding:8px 0;
  }
</style>
</head>
<body>

<header>
  <h1>🎨 কালার রিকুয়েস্ট</h1>
  <p>স্ক্রিন প্রিন্ট কালার অর্ডার — সহজ, রঙিন, স্টাইলিশ</p>
</header>

<div class="container">

  <div class="card">
    <div class="header-field">
      <label>দোকান / ফ্যাক্টরির নাম</label>
      <input type="text" id="colorShopName" placeholder="দোকান বা ফ্যাক্টরির নাম লিখুন">
    </div>

    <div class="row-two">
      <div class="field grow">
        <label>ঠিকানা</label>
        <input type="text" id="colorAddress" placeholder="দোকানের ঠিকানা লিখুন">
      </div>
      <div class="field small">
        <label>তারিখ</label>
        <input type="date" id="colorDate">
      </div>
    </div>

    <div class="row-two">
      <div class="field grow">
        <label>ফোন নম্বর (ঐচ্ছিক)</label>
        <input type="text" id="colorPhone" placeholder="যোগাযোগের নম্বর">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">📋 কালারের তালিকা</div>
    <div class="sheet-wrap">
      <table class="sheet">
        <thead>
          <tr>
            <th style="width:22px;">নং</th>
            <th style="width:30px;">রঙ</th>
            <th style="text-align:left;">কালারের নাম</th>
            <th style="width:55px;">পরিমাণ</th>
            <th style="width:60px;">একক</th>
            <th style="width:22px;"></th>
          </tr>
        </thead>
        <tbody id="colorRows"></tbody>
      </table>
    </div>
    <button class="add-row-btn" onclick="addColorRow()">+ নতুন লাইন যোগ করুন</button>

    <div class="totals" id="totalsBox"></div>

    <button class="pdf-btn" onclick="downloadColorPDF()">📄 পিডিএফ ডাউনলোড করুন</button>
  </div>

</div>

<script>
const { jsPDF } = window.jspdf;

/* ---------- default date ---------- */
function todayStr(){
  const d = new Date();
  return d.toISOString().split('T')[0];
}
document.getElementById('colorDate').value = todayStr();

/* ---------- COLOR ROWS (swatch, name, quantity, unit) ---------- */
let colorRowCount = 0;
function addColorRow(name='', hex='#12a37f'){
  colorRowCount++;
  const tbody = document.getElementById('colorRows');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="sl">${colorRowCount}</td>
    <td class="swatch-cell"><input type="color" value="${hex}"></td>
    <td class="col-name"><input type="text" placeholder="কালারের নাম" value="${name}"></td>
    <td><input type="number" step="any" placeholder="0" oninput="calcTotals()"></td>
    <td>
      <select oninput="calcTotals()" onchange="calcTotals()">
        <option value="কেজি">কেজি</option>
        <option value="পিস">পিস</option>
        <option value="মিটার">মিটার</option>
        <option value="লিটার">লিটার</option>
      </select>
    </td>
    <td class="del-cell"><button class="del-btn" onclick="removeRow(this)">✕</button></td>
  `;
  tbody.appendChild(tr);
  calcTotals();
}

function removeRow(btn){
  const tr = btn.closest('tr');
  tr.remove();
  const rows = document.querySelectorAll('#colorRows tr');
  rows.forEach((r,i)=>{ r.querySelector('.sl').innerText = i+1; });
  colorRowCount = rows.length;
  calcTotals();
}

function calcTotals(){
  const rows = document.querySelectorAll('#colorRows tr');
  const totalsByUnit = {};
  rows.forEach(r=>{
    const qty = parseFloat(r.querySelector('input[type=number]').value) || 0;
    const unit = r.querySelector('select').value;
    totalsByUnit[unit] = (totalsByUnit[unit] || 0) + qty;
  });
  const box = document.getElementById('totalsBox');
  const keys = Object.keys(totalsByUnit).filter(u => totalsByUnit[u] > 0);
  if(keys.length===0){
    box.innerHTML = '<div class="empty-note">এখনো কোনো পরিমাণ যোগ করা হয়নি</div>';
    return;
  }
  box.innerHTML = keys.map(u =>
    `<div class="totals-line"><span>মোট (${u}):</span><span class="value">${totalsByUnit[u]}</span></div>`
  ).join('');
}

/* ---------- PDF generation ---------- */
function downloadColorPDF(){
  const shop = document.getElementById('colorShopName').value || '-';
  const address = document.getElementById('colorAddress').value || '';
  const phone = document.getElementById('colorPhone').value || '';
  const date = document.getElementById('colorDate').value || todayStr();

  const rowEls = document.querySelectorAll('#colorRows tr');
  const rows = [];
  const hexList = [];
  rowEls.forEach((r,i)=>{
    const colorInput = r.querySelector('input[type=color]');
    const nameInput = r.querySelector('.col-name input');
    const qtyInput = r.querySelector('input[type=number]');
    const unitSelect = r.querySelector('select');
    hexList.push(colorInput.value);
    rows.push(['', nameInput.value || '-', qtyInput.value || '0', unitSelect.value]);
  });

  if(rows.length===0){ alert('অন্তত একটি কালার লাইন যোগ করুন'); return; }

  const doc = new jsPDF();
  const titleX = 105;

  doc.setFontSize(18);
  doc.text(shop, titleX, 18, { align: 'center' });

  let subY = 26;
  if(address){
    doc.setFontSize(10);
    doc.text(address, titleX, subY, { align: 'center' });
    subY += 6;
  }
  if(phone){
    doc.setFontSize(10);
    doc.text('Phone: ' + phone, titleX, subY, { align: 'center' });
    subY += 6;
  }
  doc.setFontSize(11);
  doc.text('Color Order Request', titleX, subY, { align: 'center' });
  subY += 6;
  doc.setFontSize(10);
  doc.text('Date: ' + date, 150, 18);

  subY += 4;

  doc.autoTable({
    startY: subY,
    head: [['','Color Name','Quantity','Unit']],
    body: rows,
    theme: 'grid',
    headStyles: { fillColor: [15,110,92] },
    styles: { fontSize: 10, minCellHeight: 9 },
    columnStyles: { 0: { cellWidth: 12 } },
    didDrawCell: function(data){
      if(data.section === 'body' && data.column.index === 0){
        const hex = hexList[data.row.index] || '#ffffff';
        const r = parseInt(hex.substr(1,2),16);
        const g = parseInt(hex.substr(3,2),16);
        const b = parseInt(hex.substr(5,2),16);
        doc.setFillColor(r,g,b);
        doc.setDrawColor(120,120,120);
        const boxSize = 6;
        const x = data.cell.x + (data.cell.width - boxSize)/2;
        const y = data.cell.y + (data.cell.height - boxSize)/2;
        doc.rect(x, y, boxSize, boxSize, 'FD');
      }
    }
  });

  let y = doc.lastAutoTable.finalY + 8;
  doc.setFontSize(11);

  const totalsByUnit = {};
  rows.forEach(r=>{
    const q = parseFloat(r[2]) || 0;
    const u = r[3];
    totalsByUnit[u] = (totalsByUnit[u] || 0) + q;
  });
  Object.keys(totalsByUnit).forEach(u=>{
    if(totalsByUnit[u] > 0){
      doc.text(`Total (${u}): ${totalsByUnit[u]}`, 14, y);
      y += 6;
    }
  });

  const fileName = 'color-order-' + date + '.pdf';
  savePdfSmart(doc, fileName);
}

function savePdfSmart(doc, fileName){
  if(window.AndroidPDF && typeof window.AndroidPDF.savePdf === 'function'){
    const base64 = doc.output('datauristring').split(',')[1];
    window.AndroidPDF.savePdf(base64, fileName);
  } else {
    doc.save(fileName);
  }
}

/* ---------- init ---------- */
for(let i=0;i<4;i++) addColorRow();
</script>

</body>
</html>
